<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="704" viewBox="0 0 1224 704" role="img" aria-label="Ohtia: character dimensions">
  <title>Ohtia: character dimensions</title>
  <style>
    :root { --page: #faf8f5; --panel: #f4f1ed; --line: #dad7d2; --grid: #ebe7e2; --fg: #1f1d19; --fg2: #4e4a43; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #151411; --panel: #1a1815; --line: #35322e; --grid: #262420; --fg: #ebe7e2; --fg2: #c1bdb7; }
    }
    .sheet { fill: var(--page); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .grid-major { stroke: var(--line); stroke-width: 1; }
    .axis { font: 400 11px 'IBM Plex Sans', sans-serif; fill: var(--fg2); }
    .title { font: 600 16px 'IBM Plex Sans', sans-serif; fill: var(--fg); }
    .legend { font: 400 13px 'IBM Plex Sans', sans-serif; fill: var(--fg); }
    .legend-note { font: 400 12px 'IBM Plex Sans', sans-serif; fill: var(--fg2); }
    .mark { fill: none; stroke: var(--fg); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
    .lead { fill: none; stroke: var(--fg2); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
    .badge { fill: var(--page); stroke: var(--fg); stroke-width: 1.25; }
    .badge-text { font: 600 11px 'IBM Plex Sans', sans-serif; fill: var(--fg); text-anchor: middle; }

    .gl-line { fill: none; stroke: #6f2b55; stroke-width: 4; stroke-linecap: round; }
    .gl-lens { fill: #fae9f2; stroke: #6f2b55; stroke-width: 4.5; }
    .gl-pupil { fill: #6f2b55; }
    .bd-hair { fill: #6f2b55; stroke: #6f2b55; stroke-width: 2; stroke-linejoin: round; }
    .bd-face, .bd-skin { fill: #fae9f2; stroke: #6f2b55; stroke-width: 3; }
    .bd-coat { fill: #fae9f2; stroke: #6f2b55; stroke-width: 3; stroke-linejoin: round; }
    .bd-line { fill: none; stroke: #6f2b55; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .bd-pocket { fill: none; stroke: #6f2b55; stroke-width: 2.5; }
    .bd-pencil { fill: none; stroke: #6f2b55; stroke-width: 3.5; stroke-linecap: round; }
    .bd-strand { fill: none; stroke: #6f2b55; stroke-width: 3.5; stroke-linecap: round; }
    .bd-bun { fill: #6f2b55; stroke: #6f2b55; stroke-width: 1.5; }
    .bd-curl { fill: none; stroke: #fae9f2; stroke-width: 2; stroke-linecap: round; }
    .bd-pencil-band { stroke: #fae9f2; stroke-width: 1.5; }
    .bd-brow { fill: none; stroke: #6f2b55; stroke-width: 3.5; stroke-linecap: round; }
    .bd-mouth { fill: none; stroke: #6f2b55; stroke-width: 3; stroke-linecap: round; }
    .m-flat, .m-o { opacity: 0; }
    @media (prefers-color-scheme: dark) {
      .gl-line { fill: none; stroke: #edaed1; stroke-width: 4; stroke-linecap: round; }
      .gl-lens { fill: #341e2b; stroke: #edaed1; stroke-width: 4.5; }
      .gl-pupil { fill: #edaed1; }
      .bd-hair { fill: #edaed1; stroke: #edaed1; stroke-width: 2; stroke-linejoin: round; }
      .bd-face, .bd-skin { fill: #341e2b; stroke: #edaed1; stroke-width: 3; }
      .bd-coat { fill: #341e2b; stroke: #edaed1; stroke-width: 3; stroke-linejoin: round; }
      .bd-line { fill: none; stroke: #edaed1; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .bd-pocket { fill: none; stroke: #edaed1; stroke-width: 2.5; }
      .bd-pencil { fill: none; stroke: #edaed1; stroke-width: 3.5; stroke-linecap: round; }
      .bd-strand { fill: none; stroke: #edaed1; stroke-width: 3.5; stroke-linecap: round; }
      .bd-bun { fill: #edaed1; stroke: #edaed1; stroke-width: 1.5; }
      .bd-curl { fill: none; stroke: #341e2b; stroke-width: 2; stroke-linecap: round; }
      .bd-pencil-band { stroke: #341e2b; stroke-width: 1.5; }
      .bd-brow { fill: none; stroke: #edaed1; stroke-width: 3.5; stroke-linecap: round; }
      .bd-mouth { fill: none; stroke: #edaed1; stroke-width: 3; stroke-linecap: round; }
      .m-flat, .m-o { opacity: 0; }
    }
    </style>
