  <text class="title" x="704" y="30">Ohtia character: dimensions</text>
  <circle class="badge" cx="714" cy="56" r="10"/><text class="badge-text" x="714" y="60">1</text>
  <text class="legend" x="734" y="60">Face: center (60; 66), radius 30, stroke 3.</text>
  <circle class="badge" cx="714" cy="86" r="10"/><text class="badge-text" x="714" y="90">2</text>
  <text class="legend" x="734" y="90">Glasses: the 64 × 64 piece translated to (28; 30);</text>
  <text class="legend" x="734" y="108">lenses at (47; 64) and (73; 64).</text>
  <circle class="badge" cx="714" cy="134" r="10"/><text class="badge-text" x="714" y="138">3</text>
  <text class="legend" x="734" y="138">Eyebrows, stroke 3.5: left from (38; 45) to (56; 44), control</text>
  <text class="legend" x="734" y="156">(47; 40); right from (64; 44) to (82; 45), control (73; 40).</text>
  <circle class="badge" cx="714" cy="182" r="10"/><text class="badge-text" x="714" y="186">4</text>
  <text class="legend" x="734" y="186">Mouth, stroke 3: smile from (51; 84) to (69; 84), control (60; 91);</text>
  <text class="legend" x="734" y="204">straight from (53; 86) to (67; 86); open, ellipse at (60; 86)</text>
  <text class="legend" x="734" y="222">with radii 3.5 and 4.5.</text>
  <circle class="badge" cx="714" cy="248" r="10"/><text class="badge-text" x="714" y="252">5</text>
  <text class="legend" x="734" y="252">Curls: 9 quadratic curves around (60; 62), from 150° to 390°;</text>
  <text class="legend" x="734" y="270">valleys at radius 31, controls cycling through radii 47, 49, 51;</text>
  <text class="legend" x="734" y="288">fill and stroke 2.</text>
  <circle class="badge" cx="714" cy="314" r="10"/><text class="badge-text" x="714" y="318">6</text>
  <text class="legend" x="734" y="318">Strands, stroke 3.5: M31 50 Q22 66 28 80 Q33 90 27 98</text>
  <text class="legend" x="734" y="336">and its reflection about x = 60.</text>
  <circle class="badge" cx="714" cy="362" r="10"/><text class="badge-text" x="714" y="366">7</text>
  <text class="legend" x="734" y="366">Bun: center (60; 17), radius 12, stroke 1.5; highlight from (52.5; 14)</text>
  <text class="legend" x="734" y="384">to (61.5; 8.5) with control (55; 8.5), stroke 2.</text>
  <circle class="badge" cx="714" cy="410" r="10"/><text class="badge-text" x="714" y="414">8</text>
  <text class="legend" x="734" y="414">Pencil: from (46; 24) to (76; 6), stroke 3.5; tip at (46; 24);</text>
  <text class="legend" x="734" y="432">band from (69.5; 7.6) to (71.5; 11), stroke 1.5.</text>
  <circle class="badge" cx="714" cy="458" r="10"/><text class="badge-text" x="714" y="462">9</text>
  <text class="legend" x="734" y="462">Neck: rectangle at (53; 88), 14 × 18, stroke 3.</text>
  <circle class="badge" cx="714" cy="488" r="10"/><text class="badge-text" x="714" y="492">10</text>
  <text class="legend" x="734" y="492">Lab coat: M24 152 L30 116 Q60 100 90 116 L96 152 Z, stroke 3;</text>
  <text class="legend" x="734" y="510">lapels M48 107 L60 128 L72 107 and opening M60 128 L60 152,</text>
  <text class="legend" x="734" y="528">stroke 2.5.</text>
  <circle class="badge" cx="714" cy="554" r="10"/><text class="badge-text" x="714" y="558">11</text>
  <text class="legend" x="734" y="558">Pocket: rectangle at (74; 128), 12 × 9, corner radius 1.5,</text>
  <text class="legend" x="734" y="576">stroke 2.5, no fill.</text>
  <text class="legend-note" x="704" y="612">Frame: viewBox from (−16; 0) to (136; 152). Grid every 8, dimensions every 16.</text>
  <text class="legend-note" x="704" y="630">The dashed rectangle is the glasses piece: the destination of the</text>
  <text class="legend-note" x="704" y="648">character-to-brand transition. Fills in voice.ohtia.surface; strokes, hair,</text>
  <text class="legend-note" x="704" y="666">bun and pencil in voice.ohtia.content. Character used from 96 px.</text>
</svg>
