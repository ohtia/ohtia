  <text class="legend" x="638" y="268">Pupil travel: its center moves no farther</text>
  <text class="legend" x="638" y="286">than 4.5 from the lens center.</text>
  <text class="legend-note" x="608" y="322">64 × 64 unit grid; lines every 4 and dimensions every 8.</text>
  <text class="legend-note" x="608" y="340">Round-ended strokes. Lens fill in voice.ohtia.surface;</text>
  <text class="legend-note" x="608" y="358">strokes and pupils in voice.ohtia.content.</text>
  <text class="legend-note" x="608" y="376">24 px icon: same geometry scaled by 0.375 and shifted −0.75</text>
