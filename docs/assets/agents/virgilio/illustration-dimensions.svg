<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="740" viewBox="0 0 1202 740" role="img" aria-label="Virgilio: illustration dimensions">
  <title>Virgilio: illustration dimensions</title>
  <style>
    :root { --page: #faf8f5; --panel: #f4f1ed; --line: #dad7d2; --grid: #ebe7e2; --fg: #1f1d19; --fg2: #4e4a43; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #151411; --panel: #1a1815; --line: #35322e; --grid: #262420; --fg: #ebe7e2; --fg2: #c1bdb7; }
    }
    .sheet { fill: var(--page); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .grid-major { stroke: var(--line); stroke-width: 1; }
    .axis { font: 400 11px 'IBM Plex Sans', sans-serif; fill: var(--fg2); }
    .title { font: 600 16px 'IBM Plex Sans', sans-serif; fill: var(--fg); }
    .legend { font: 400 13px 'IBM Plex Sans', sans-serif; fill: var(--fg); }
    .legend-note { font: 400 12px 'IBM Plex Sans', sans-serif; fill: var(--fg2); }
    .mark { fill: none; stroke: var(--fg); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
    .lead { fill: none; stroke: var(--fg2); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
    .badge { fill: var(--page); stroke: var(--fg); stroke-width: 1.25; }
    .badge-text { font: 600 11px 'IBM Plex Sans', sans-serif; fill: var(--fg); text-anchor: middle; }
    .c-surface { fill: #e0f4eb; stroke: #07553e; stroke-width: 3; stroke-linejoin: round; }
    .c-accent { fill: #85d0b1; stroke: #07553e; stroke-width: 3; stroke-linejoin: round; }
    .c-paper { fill: #e0f4eb; stroke: #07553e; stroke-width: 2.5; stroke-linejoin: round; }
    .c-line { fill: none; stroke: #07553e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .c-thin { fill: none; stroke: #07553e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .c-hair { fill: #07553e; stroke: #07553e; stroke-width: 2; stroke-linejoin: round; }
    .c-hair-line { fill: none; stroke: #e0f4eb; stroke-width: 2; stroke-linecap: round; }
    .c-brow { fill: none; stroke: #07553e; stroke-width: 3.5; stroke-linecap: round; }
    .c-mouth { fill: none; stroke: #07553e; stroke-width: 3; stroke-linecap: round; }
    .c-fill { fill: #07553e; }
    .c-hole { fill: #e0f4eb; stroke: #07553e; stroke-width: 1.8; }
    .c-dash { fill: none; stroke: #07553e; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 0.1 5; }
    @media (prefers-color-scheme: dark) {
      .c-surface { fill: #142c22; stroke: #98dcbf; stroke-width: 3; stroke-linejoin: round; }
      .c-accent { fill: #286c53; stroke: #98dcbf; stroke-width: 3; stroke-linejoin: round; }
      .c-paper { fill: #142c22; stroke: #98dcbf; stroke-width: 2.5; stroke-linejoin: round; }
