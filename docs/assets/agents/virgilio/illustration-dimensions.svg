      .c-hair-line { fill: none; stroke: #142c22; stroke-width: 2; stroke-linecap: round; }
      .c-brow { fill: none; stroke: #98dcbf; stroke-width: 3.5; stroke-linecap: round; }
      .c-mouth { fill: none; stroke: #98dcbf; stroke-width: 3; stroke-linecap: round; }
      .c-fill { fill: #98dcbf; }
      .c-hole { fill: #142c22; stroke: #98dcbf; stroke-width: 1.8; }
      .c-dash { fill: none; stroke: #98dcbf; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 0.1 5; }
    }
