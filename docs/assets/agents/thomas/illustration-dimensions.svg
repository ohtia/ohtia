      .c-brow { fill: none; stroke: #95d6f0; stroke-width: 3.5; stroke-linecap: round; }
      .c-mouth { fill: none; stroke: #95d6f0; stroke-width: 3; stroke-linecap: round; }
      .c-fill { fill: #95d6f0; }
      .c-hole { fill: #112a33; stroke: #95d6f0; stroke-width: 1.8; }
