name: Isolated Linux signing build

on:
  workflow_call:
    inputs:
      selection:
        description: One Linux target and native distribution profile from the target manifest
        required: true
        type: string
    outputs:
      proof-artifact:
        description: The exact attestor output artifact name; this is a locator, not authority
        value: ${{ jobs.attest.outputs.proof-artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Construct unsigned package
    if: github.repository == 'ohtia/ohtia' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ startsWith(inputs.selection, 'linux-arm64-') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUILD_SELECTION: ${{ inputs.selection }}
      SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
      - name: Check out the immutable recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ohtia/ohtia
          ref: ${{ job.workflow_sha }}
          path: recipe
          persist-credentials: false
      - name: Check out candidate source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ohtia/ohtia
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - name: Install native package construction tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
      - name: Construct the workspace and unsigned package without signing authority
        working-directory: source
        env:
          BUILD_OUTPUT: ${{ runner.temp }}/installation-build
          RECIPE_SHA: ${{ job.workflow_sha }}
          RECIPE_REF: ${{ job.workflow_ref }}
          ATTESTOR_JOB_ID: ${{ job.check_run_id }}
        run: |
          python3 scripts/workspace.py setup
          python3 scripts/workspace.py run build
          python3 ../recipe/scripts/installation_build.py
      - name: Retain this job's exact package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/installation-build/package.*
          if-no-files-found: error
          overwrite: false
          archive: true
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest unsigned package
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
      attestations: write
    outputs:
      proof-artifact: installation-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
    env:
      BUILD_SELECTION: ${{ inputs.selection }}
      SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
      - name: Check out only the immutable recipe's helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ohtia/ohtia
          ref: ${{ job.workflow_sha }}
          path: recipe
          persist-credentials: false
      - name: Check out candidate bytes for data-only inspection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ohtia/ohtia
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Set up Python without installing candidate dependencies
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - name: Install native metadata readers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
      - name: Inspect producer identity and hash the confined package
        # This path is checked out at job.workflow_sha, separately from the caller source.
        uses: ./recipe/.github/actions/installation-attestor # zizmor: ignore[self-repository]
        env:
          ATTESTOR_OUTPUT: ${{ runner.temp }}/installation-attestation
          RECIPE_SHA: ${{ job.workflow_sha }}
          RECIPE_REF: ${{ job.workflow_ref }}
          ATTESTOR_JOB_ID: ${{ job.check_run_id }}
          ATTESTOR_PYTHON: ${{ steps.python.outputs.python-path }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Issue custom SLSA provenance over the exact package bytes
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/installation-attestation/package.*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/installation-attestation/predicate.json
      - name: Install the recipe's checksum-pinned verifier
        env:
          RECIPE_SHA: ${{ job.workflow_sha }}
          RECIPE_REF: ${{ job.workflow_ref }}
          ATTESTOR_JOB_ID: ${{ job.check_run_id }}
          ATTESTOR_OPERATION: install-cli
          ATTESTOR_GH_DIRECTORY: ${{ runner.temp }}/attestor-gh
        run: python3 recipe/scripts/installation_attestor.py
      - name: Verify the genuine certificate and complete predicate before retaining proof
        env:
          ATTESTOR_OUTPUT: ${{ runner.temp }}/installation-attestation
          RECIPE_SHA: ${{ job.workflow_sha }}
          RECIPE_REF: ${{ job.workflow_ref }}
          ATTESTOR_JOB_ID: ${{ job.check_run_id }}
          ATTESTOR_OPERATION: verify
          ATTESTOR_GH: ${{ runner.temp }}/attestor-gh/gh
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 recipe/scripts/installation_attestor.py
      - name: Retain package, closure and authenticated build proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/installation-attestation/
          if-no-files-found: error
          overwrite: false
          retention-days: 14
