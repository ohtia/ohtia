name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested revision
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          pull = event.get("pull_request") or {}
          def revision(ref):
              return subprocess.check_output(["git", "rev-parse", ref], text=True).strip()
          receipt = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pull_request": event.get("number") if pull else None,
              "head_sha": pull.get("head", {}).get("sha"),
              "base_sha": pull.get("base", {}).get("sha"),
              "github_sha": os.environ["GITHUB_SHA"],
              "checkout_sha": revision("HEAD"),
              "tree_sha": revision("HEAD^{tree}"),
          }
          print("OHTIA_" + "CI_PROVENANCE=" + json.dumps(receipt, separators=(",", ":")))
          PYTHON

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Set up frozen workspace
        run: python3 scripts/workspace.py setup

      - name: Run repository hooks
        env:
          # Branch protection belongs to GitHub; the staged-file scan is local-only.
          SKIP: no-commit-to-branch,gitleaks
        run: python3 scripts/workspace.py run hooks

      - name: Scan committed history for secrets
        run: python3 scripts/workspace.py run hooks:history

      - name: Run shared checks
        run: python3 scripts/workspace.py run check

      - name: Authenticate Linux E2E image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Run immutable sandboxed Linux E2E
        run: bash tools/linux-e2e/run.sh --output .reports/linux-e2e-ci
