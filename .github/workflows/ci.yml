name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: full-suite (ubuntu-26.04-x64)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source with full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested revision
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          pull = event.get("pull_request") or {}
          def revision(ref):
              return subprocess.check_output(["git", "rev-parse", ref], text=True).strip()
          receipt = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pull_request": event.get("number") if pull else None,
              "head_sha": pull.get("head", {}).get("sha"),
              "base_sha": pull.get("base", {}).get("sha"),
              "github_sha": os.environ["GITHUB_SHA"],
              "checkout_sha": revision("HEAD"),
              "tree_sha": revision("HEAD^{tree}"),
          }
          print("OHTIA_" + "CI_PROVENANCE=" + json.dumps(receipt, separators=(",", ":")))
          PYTHON

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Set up frozen workspace
        run: python3 scripts/workspace.py setup

      - name: Run repository hooks
        env:
          # Branch protection belongs to GitHub; the staged-file scan is local-only.
          SKIP: no-commit-to-branch,gitleaks
        run: python3 scripts/workspace.py run hooks

      - name: Scan committed history for secrets
        run: python3 scripts/workspace.py run hooks:history

      - name: Run full test suite and quality checks
        run: python3 scripts/workspace.py run check

      - name: Authenticate Linux E2E image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Run immutable sandboxed Linux E2E
        run: bash tools/linux-e2e/run.sh --output .reports/linux-e2e-ci

  scope:
    name: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - name: Check out source with full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested revision
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          pull = event.get("pull_request") or {}
          def revision(ref):
              return subprocess.check_output(["git", "rev-parse", ref], text=True).strip()
          receipt = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pull_request": event.get("number") if pull else None,
              "head_sha": pull.get("head", {}).get("sha"),
              "base_sha": pull.get("base", {}).get("sha"),
              "github_sha": os.environ["GITHUB_SHA"],
              "checkout_sha": revision("HEAD"),
              "tree_sha": revision("HEAD^{tree}"),
          }
          print("OHTIA_" + "CI_PROVENANCE=" + json.dumps(receipt, separators=(",", ":")))
          PYTHON

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Select quality scope
        id: select
        run: python3 scripts/quality_delivery.py scope

  native:
    name: native (${{ matrix.id }})
    needs: scope
    if: needs.scope.outputs.selection == 'full-required-matrix'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-24-04-x64-x11
            runner: ubuntu-24.04
          - id: ubuntu-24-04-x64-wayland
            runner: ubuntu-24.04
          - id: ubuntu-24-04-arm64-x11
            runner: ubuntu-24.04-arm
          - id: ubuntu-24-04-arm64-wayland
            runner: ubuntu-24.04-arm
          - id: ubuntu-26-04-x64-x11
            runner: ubuntu-26.04
          - id: ubuntu-26-04-x64-wayland
            runner: ubuntu-26.04
          - id: ubuntu-26-04-arm64-x11
            runner: ubuntu-26.04-arm
          - id: ubuntu-26-04-arm64-wayland
            runner: ubuntu-26.04-arm
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
          - id: macos-26-arm64
            runner: macos-26
          - id: macos-27-arm64
            runner: xcode-27
          - id: fedora-44-x64-vm
            runner: ubuntu-26.04
          - id: debian-13-x64-vm
            runner: ubuntu-26.04
    steps:
      - name: Check out source with full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Record tested revision
        run: |
          python -I - <<'PYTHON'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          pull = event.get("pull_request") or {}
          def revision(ref):
              return subprocess.check_output(["git", "rev-parse", ref], text=True).strip()
          receipt = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pull_request": event.get("number") if pull else None,
              "head_sha": pull.get("head", {}).get("sha"),
              "base_sha": pull.get("base", {}).get("sha"),
              "github_sha": os.environ["GITHUB_SHA"],
              "checkout_sha": revision("HEAD"),
              "tree_sha": revision("HEAD^{tree}"),
          }
          print("OHTIA_" + "CI_PROVENANCE=" + json.dumps(receipt, separators=(",", ":")))
          PYTHON

      - name: Prepare native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils cloud-image-utils xvfb xauth dbus-x11 gnome-shell gnome-session dbus-user-session xdg-utils iproute2 acl libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libsecret-1-0 libnotify4 libatspi2.0-0 apparmor
          dpkg-query -W > "$RUNNER_TEMP/ohtia-native-packages.txt"

      - name: Prepare native VM acceleration
        if: endsWith(matrix.id, '-vm')
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Set up frozen workspace
        if: ${{ !endsWith(matrix.id, '-vm') }}
        run: python scripts/workspace.py setup

      - name: Build and smoke-test native packages
        env:
          OHTIA_QUALITY_CELL: ${{ matrix.id }}
        run: |
          if [[ "$OHTIA_QUALITY_CELL" == *-vm ]]; then
            python scripts/quality_vm.py "$OHTIA_QUALITY_CELL" artifacts/quality-result
          elif [[ "$OHTIA_QUALITY_CELL" == *-wayland ]]; then
            dbus-run-session -- python scripts/quality_display.py "$OHTIA_QUALITY_CELL" artifacts/quality-result
          elif [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- python scripts/workspace.py run quality:build "$OHTIA_QUALITY_CELL" artifacts/quality-result
          else
            python scripts/workspace.py run quality:build "$OHTIA_QUALITY_CELL" artifacts/quality-result
          fi

      - name: Retain native quality artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality-result/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ci:
    name: ci
    needs: [scope, checks, native]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source with full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested revision
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          pull = event.get("pull_request") or {}
          def revision(ref):
              return subprocess.check_output(["git", "rev-parse", ref], text=True).strip()
          receipt = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pull_request": event.get("number") if pull else None,
              "head_sha": pull.get("head", {}).get("sha"),
              "base_sha": pull.get("base", {}).get("sha"),
              "github_sha": os.environ["GITHUB_SHA"],
              "checkout_sha": revision("HEAD"),
              "tree_sha": revision("HEAD^{tree}"),
          }
          print("OHTIA_" + "CI_PROVENANCE=" + json.dumps(receipt, separators=(",", ":")))
          PYTHON

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Require every quality job
        env:
          OHTIA_QUALITY_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/quality_delivery.py needs

      - name: Download native quality artifacts
        if: needs.scope.outputs.selection == 'full-required-matrix'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality-inputs
          digest-mismatch: error

      - name: Verify complete native quality delivery
        if: needs.scope.outputs.selection == 'full-required-matrix'
        run: |
          python3 scripts/quality_delivery.py plan artifacts/quality-plan.json
          python3 scripts/quality_delivery.py aggregate artifacts/quality-plan.json artifacts/quality-inputs artifacts/quality-summary.json

      - name: Retain coordinated quality evidence
        if: needs.scope.outputs.selection == 'full-required-matrix'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/quality-plan.json
            artifacts/quality-summary.json
          if-no-files-found: error
          retention-days: 14
