name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.2

      - name: Run repository hooks
        env:
          # Branch protection belongs to GitHub; the staged-file scan is local-only.
          SKIP: no-commit-to-branch,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Scan committed history for secrets
        run: pre-commit run --hook-stage manual gitleaks-history --all-files

      - name: Test repository policy
        run: python -m unittest discover -s scripts/tests -v
