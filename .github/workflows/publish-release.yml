name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the prepared unpublished release, such as 0.1.0
        required: true
        type: string

permissions: {}

# Publication is serialized across every version and surface; a second run waits.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  check:
    name: Check the prepared release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write # Reads the unpublished release and downloads its assets; GitHub shows unpublished releases only to tokens with write access. This job changes nothing.
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      release: ${{ steps.check.outputs.release }}
      body: ${{ steps.check.outputs.body }}
      final: ${{ steps.check.outputs.final }}
      digests: ${{ steps.check.outputs.digests }}
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Verify every asset against the digest file
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OHTIA_RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release_publish.py check

  repository:
    name: Copy the Debian packages to the stable repositories
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # The approval page of this first protected job shows the checked version, commit and digests.
    environment: release-signing
    # One run at a time writes the package repositories of either workflow.
    concurrency:
      group: package-repositories
      cancel-in-progress: false
    permissions:
      contents: write # Reads the release, which GitHub shows only to tokens with write access while it is unpublished. This job changes no release.
    # This job holds the signing subkey and the bucket credential: it installs nothing and runs
    # no project code; the action's tools come from the runner image.
    steps:
      - name: Check out the release records
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config/release
          persist-credentials: false

      - name: Publish the stable apt repositories
        uses: $/.github/actions/apt-repository
        with:
          zone: stable
          version: ${{ inputs.version }}
          commit: ${{ needs.check.outputs.commit }}
          digests-sha256: ${{ needs.check.outputs.digests }}
          github-token: ${{ github.token }}
          signing-subkey: ${{ secrets.SIGNING_SUBKEY }}
          signing-passphrase: ${{ secrets.SIGNING_PASSPHRASE }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}

  publish:
    name: Publish the release
    needs: [check, repository]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: write # Removes the unsigned assets and the testing-only heading, uploads the notes digest and makes the release public, which creates v<version>.
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Publish the approved release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OHTIA_RELEASE_VERSION: ${{ inputs.version }}
          OHTIA_RELEASE_COMMIT: ${{ needs.check.outputs.commit }}
          OHTIA_RELEASE_ID: ${{ needs.check.outputs.release }}
          OHTIA_RELEASE_BODY_SHA256: ${{ needs.check.outputs.body }}
          OHTIA_RELEASE_FINAL_SHA256: ${{ needs.check.outputs.final }}
          OHTIA_RELEASE_DIGESTS_SHA256: ${{ needs.check.outputs.digests }}
        run: python3 scripts/release_publish.py publish
