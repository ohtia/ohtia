name: Installation signing qualification
run-name: Installation signing qualification · ${{ inputs.mode }} · ${{ inputs.selection }}

on:
  workflow_dispatch:
    inputs:
      hash:
        description: Full commit SHA already in main; empty uses main at dispatch
        required: false
        type: string
        default: ""
      mode:
        description: Qualify build provenance or request private package and catalog signing
        required: true
        type: choice
        default: provenance
        options:
          - provenance
          - sign
      selection:
        description: Linux package whose build provenance or private signing will be qualified
        required: true
        type: choice
        default: linux-x64-debian-13
        options:
          - linux-x64-ubuntu-26.04
          - linux-arm64-ubuntu-26.04
          - linux-x64-fedora-44
          - linux-arm64-fedora-44
          - linux-x64-debian-13
          - linux-arm64-debian-13

permissions:
  contents: read

jobs:
  validate:
    name: Validate qualification request
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source-commit: ${{ steps.source.outputs.source-commit }}
    steps:
      - name: Refuse other execution identities modes and selections before construction
        shell: bash
        env:
          QUALIFICATION_SELECTION: ${{ inputs.selection }}
          QUALIFICATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true ||
                "${RUNNER_ENVIRONMENT:-}" != github-hosted ||
                "${GITHUB_REPOSITORY:-}" != ohtia/ohtia ||
                "${GITHUB_REPOSITORY_ID:-}" != 1431132416 ||
                "${GITHUB_REPOSITORY_OWNER_ID:-}" != 346940169 ||
                "${GITHUB_REF:-}" != refs/heads/main ||
                "${GITHUB_EVENT_NAME:-}" != workflow_dispatch ]]; then
            printf '%s\n' 'Build provenance qualification refused: execution identity.' >&2
            exit 1
          fi
          case "${QUALIFICATION_MODE:-}" in
            provenance|sign) ;;
            *)
              printf '%s\n' 'Installation signing qualification refused: mode.' >&2
              exit 1
              ;;
          esac
          case "${QUALIFICATION_SELECTION:-}" in
            linux-x64-ubuntu-26.04|linux-arm64-ubuntu-26.04|linux-x64-fedora-44|linux-arm64-fedora-44|linux-x64-debian-13|linux-arm64-debian-13) ;;
            *)
              printf '%s\n' 'Build provenance qualification refused: selection.' >&2
              exit 1
              ;;
          esac

      - name: Check out the main workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the source resolver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - name: Fix the exact package source from main
        id: source
        env:
          SOURCE_HASH: ${{ inputs.hash }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/installation_source.py

  provenance:
    name: Qualify Linux build provenance
    needs: validate
    # The caller grants a ceiling; the recipe's constructor explicitly reduces it to contents:read.
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
      attestations: write
    uses: ohtia/ohtia/.github/workflows/signing-build.yml@c126422120996d39c976201d002d1ded8137913c
    with:
      selection: ${{ inputs.selection }}
      source-commit: ${{ needs.validate.outputs.source-commit }}

  sign:
    name: Sign private package and catalog
    needs: [validate, provenance]
    if: inputs.mode == 'sign'
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: ohtia/ohtia/.github/workflows/signing-worker.yml@c126422120996d39c976201d002d1ded8137913c
    with:
      selection: ${{ inputs.selection }}
      source-commit: ${{ needs.validate.outputs.source-commit }}
      proof-artifact: ${{ needs.provenance.outputs.proof-artifact }}
