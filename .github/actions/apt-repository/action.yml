name: Publish the apt repositories
description: >-
  Copy the Debian packages of an unpublished or published release to one zone of the signed
  Ubuntu and Debian apt repositories (SPEC-001-038). The steps use only the runner image's tools
  (gh, jq, dpkg-scanpackages, gzip, gpg, aws and curl) and run no project code, because the
  signing step holds the release subkey and the upload step holds the bucket credential.

inputs:
  zone:
    description: Repository zone, stable or test
    required: true
  version:
    description: Version of the release, such as 0.3.0
    required: true
  commit:
    description: Commit the release was prepared from
    required: true
  run-id:
    description: Run that must have prepared the release; empty when the digests input binds it
    required: false
    default: ""
  digests-sha256:
    description: SHA-256 of the approved release-digests.json; empty when the run-id input binds it
    required: false
    default: ""
  github-token:
    description: Token that can read the unpublished release
    required: true
  signing-subkey:
    description: Exported signing-only subkey of the release key
    required: true
  signing-passphrase:
    description: Passphrase of the signing subkey
    required: true
  r2-access-key-id:
    description: Access key ID of the bucket-limited R2 token
    required: true
  r2-secret-access-key:
    description: Secret access key of the bucket-limited R2 token
    required: true
  r2-account-id:
    description: Cloudflare account ID that owns the bucket
    required: true

runs:
  using: composite
  steps:
    - name: Fetch the Debian packages of the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OHTIA_REPOSITORY_ZONE: ${{ inputs.zone }}
        OHTIA_RELEASE_VERSION: ${{ inputs.version }}
        OHTIA_RELEASE_COMMIT: ${{ inputs.commit }}
        OHTIA_RELEASE_RUN_ID: ${{ inputs.run-id }}
        OHTIA_RELEASE_DIGESTS_SHA256: ${{ inputs.digests-sha256 }}
      run: |
        set -euo pipefail
        refuse() { echo "Repository refused: $1" >&2; exit 1; }
        work="$RUNNER_TEMP/apt-repository"
        [[ "$OHTIA_REPOSITORY_ZONE" == stable || "$OHTIA_REPOSITORY_ZONE" == test ]] || refuse "The zone must be stable or test."
        [[ "$OHTIA_RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || refuse "The version is not a final version."
        [[ "$OHTIA_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || refuse "The commit is not a full commit SHA."
        [[ -n "$OHTIA_RELEASE_RUN_ID$OHTIA_RELEASE_DIGESTS_SHA256" ]] || refuse "Neither a run nor approved digests bind the release."
        [[ -z "$OHTIA_RELEASE_DIGESTS_SHA256" || "$OHTIA_RELEASE_DIGESTS_SHA256" =~ ^[0-9a-f]{64}$ ]] || refuse "The approved digests are not a SHA-256."
        [[ -z "$OHTIA_RELEASE_RUN_ID" || "$OHTIA_RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || refuse "The run ID is invalid."
        [[ ! -e "$work" ]] || refuse "Use a fresh runner directory."
        mkdir -m 700 "$work" "$work/downloads"
        # Unpublished releases are listed only to a token with write access; the tag names the version.
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$work/releases.json"
        jq -e --arg tag "v$OHTIA_RELEASE_VERSION" '[.[][] | select(.tag_name == $tag)] | length == 1' "$work/releases.json" > /dev/null \
          || refuse "There is not exactly one release of $OHTIA_RELEASE_VERSION."
        jq --arg tag "v$OHTIA_RELEASE_VERSION" '[.[][] | select(.tag_name == $tag)][0]' "$work/releases.json" > "$work/release.json"
        jq -e --arg version "$OHTIA_RELEASE_VERSION" --arg commit "$OHTIA_RELEASE_COMMIT" \
          '.name == $version and .target_commitish == $commit and .prerelease == false' "$work/release.json" > /dev/null \
          || refuse "The release of $OHTIA_RELEASE_VERSION does not have its prepared title and commit."
        # Download one uploaded asset by name, refusing a missing asset or one of another length.
        fetch() {
          local name=$1 bytes=$2 destination=$3 id
          id=$(jq -r --arg name "$name" --argjson bytes "$bytes" \
            '[.assets[] | select(.name == $name and .size == $bytes and .state == "uploaded")] | if length == 1 then .[0].id else "" end' "$work/release.json")
          [[ "$id" =~ ^[0-9]+$ ]] || refuse "The release has no uploaded $name of $bytes bytes."
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" < /dev/null > "$destination"
          [[ "$(stat -c %s "$destination")" == "$bytes" ]] || refuse "$name differs from the release."
        }
        digests_bytes=$(jq -r '[.assets[] | select(.name == "release-digests.json")] | if length == 1 then .[0].size else "" end' "$work/release.json")
        [[ "$digests_bytes" =~ ^[1-9][0-9]*$ && "$digests_bytes" -le 1048576 ]] || refuse "The release has no valid release-digests.json."
        fetch release-digests.json "$digests_bytes" "$work/release-digests.json"
        if [[ -n "$OHTIA_RELEASE_DIGESTS_SHA256" ]]; then
          [[ "$(sha256sum "$work/release-digests.json" | cut -d ' ' -f 1)" == "$OHTIA_RELEASE_DIGESTS_SHA256" ]] \
            || refuse "release-digests.json differs from the approved digests."
        fi
        jq -e --arg version "$OHTIA_RELEASE_VERSION" --arg commit "$OHTIA_RELEASE_COMMIT" --arg run "$OHTIA_RELEASE_RUN_ID" \
          '.schema_version == 1 and .version == $version and .source.commit == $commit and ($run == "" or (.workflow.run_id | tostring) == $run)' \
          "$work/release-digests.json" > /dev/null || refuse "release-digests.json does not describe this release."
        jq -r '.assets[] | select(.format == "deb") | [.name, .profile, .sha256, (.bytes | tostring), .authentication] | @tsv' \
          "$work/release-digests.json" > "$work/entries.tsv"
        [[ -s "$work/entries.tsv" ]] || refuse "release-digests.json lists no Debian package."
        # Preparation runs from the release's own commit, whose declaration the digest file must
        # match. Publication runs from the current main, so the approved digest file decides.
        if [[ -z "$OHTIA_RELEASE_DIGESTS_SHA256" ]]; then
          expected=$(jq '[.platforms[] | select(.id == "linux") | .builds[].packages[] | select(.format == "deb")] | length' config/release/platforms.json)
          [[ "$(grep -c . "$work/entries.tsv")" -eq "$expected" ]] || refuse "release-digests.json does not list every declared Debian package."
        fi
        : > "$work/packages.tsv"
        while IFS=$'\t' read -r name profile sha256 bytes authentication; do
          [[ "$name" =~ ^ohtia-[A-Za-z0-9._~-]+\.deb$ && "$sha256" =~ ^[0-9a-f]{64}$ && "$bytes" =~ ^[1-9][0-9]*$ ]] \
            || refuse "release-digests.json holds an invalid Debian package."
          [[ "$authentication" == repository ]] || refuse "$name is not authenticated by the repository."
          [[ "$profile" =~ ^(ubuntu|debian)-[0-9]+(\.[0-9]+)?$ ]] || refuse "$name names no Ubuntu or Debian profile."
          distribution=${profile%%-*}
          # One flat repository per distribution holds the packages of a single profile.
          if [[ -e "$work/profile-$distribution" ]]; then
            [[ "$(cat "$work/profile-$distribution")" == "$profile" ]] || refuse "Two $distribution profiles would share one repository."
          else
            printf '%s' "$profile" > "$work/profile-$distribution"
          fi
          mkdir -p "$work/packages/$distribution"
          file="$work/packages/$distribution/$name"
          [[ ! -e "$file" ]] || refuse "release-digests.json repeats $name."
          fetch "$name" "$bytes" "$file"
          [[ "$(sha256sum "$file" | cut -d ' ' -f 1)" == "$sha256" ]] || refuse "$name differs from release-digests.json."
          printf '%s\t%s\t%s\n' "$distribution" "$name" "$sha256" >> "$work/packages.tsv"
        done < "$work/entries.tsv"

    - name: Build the apt indexes
      shell: bash
      run: |
        set -euo pipefail
        refuse() { echo "Repository refused: $1" >&2; exit 1; }
        work="$RUNNER_TEMP/apt-repository"
        for directory in "$work"/packages/*/; do
          distribution=$(basename "$directory")
          index="$work/index/$distribution"
          mkdir -p "$index/by-hash/SHA256"
          # A flat repository: each Filename is ./<package>, beside the index.
          (cd "$directory" && dpkg-scanpackages --hash sha256 --multiversion . 2> /dev/null) > "$index/Packages"
          count=$(awk -F '\t' -v d="$distribution" '$1 == d' "$work/packages.tsv" | wc -l)
          [[ "$(grep -c '^Package: ' "$index/Packages")" -eq "$count" ]] || refuse "The $distribution index does not list every package."
          [[ "$(grep -c '^Package: ohtia$' "$index/Packages")" -eq "$count" ]] || refuse "The $distribution index lists another package."
          while IFS=$'\t' read -r _ name sha256; do
            grep -qxF "Filename: ./$name" "$index/Packages" && grep -qxF "SHA256: $sha256" "$index/Packages" \
              || refuse "The $distribution index does not record $name with its digest."
          done < <(awk -F '\t' -v d="$distribution" '$1 == d' "$work/packages.tsv")
          gzip -9nc "$index/Packages" > "$index/Packages.gz"
          architectures=$(sed -n 's/^Architecture: //p' "$index/Packages" | sort -u | paste -sd ' ')
          {
            printf 'Origin: Ohtia\nLabel: Ohtia\n'
            printf 'Date: %s\n' "$(LC_ALL=C date -Ru)"
            printf 'Architectures: %s\n' "$architectures"
            printf 'Acquire-By-Hash: yes\nSHA256:\n'
            for file in Packages Packages.gz; do
              printf ' %s %s %s\n' "$(sha256sum "$index/$file" | cut -d ' ' -f 1)" "$(stat -c %s "$index/$file")" "$file"
            done
          } > "$index/Release"
          # apt fetches each index by its digest, so a client never mixes two index generations.
          for file in Packages Packages.gz; do
            cp "$index/$file" "$index/by-hash/SHA256/$(sha256sum "$index/$file" | cut -d ' ' -f 1)"
          done
        done

    - name: Sign the apt indexes with the release subkey
      shell: bash
      env:
        SIGNING_SUBKEY: ${{ inputs.signing-subkey }}
        SIGNING_PASSPHRASE: ${{ inputs.signing-passphrase }}
      run: |
        set -euo pipefail
        refuse() { echo "Signing refused: $1" >&2; exit 1; }
        work="$RUNNER_TEMP/apt-repository"
        # Lists "kind:validity:capabilities:secret:fingerprint" for each key of a colon listing.
        keys() { awk -F: '$1 ~ /^(pub|sub|sec|ssb)$/ { line = $1 ":" $2 ":" $12 ":" $15; next } $1 == "fpr" && line != "" { print line ":" $10; line = "" }'; }
        fingerprint=$(jq -r 'select(.schema_version == 1) | .fingerprint' config/release/signing.json) \
          || refuse "The signing record cannot be read."
        [[ "$fingerprint" =~ ^[0-9A-F]{40}$ ]] || refuse "The signing record holds no primary fingerprint."
        committed=$(gpg --batch --with-colons --show-keys config/release/signing-key.asc | keys) \
          || refuse "The committed public key cannot be read."
        [[ "$(grep -c '^pub:' <<< "$committed")" -eq 1 && "$(grep '^pub:' <<< "$committed" | cut -d : -f 5)" == "$fingerprint" ]] \
          || refuse "The committed public key is not the recorded primary key."
        export GNUPGHOME="$work/gnupg"
        mkdir -m 700 "$GNUPGHOME"
        passphrase="$work/passphrase"
        # The imported subkey and its passphrase leave the runner before any later step runs.
        trap 'rm -f "$passphrase"; gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
        printf '%s\n' "$SIGNING_SUBKEY" | gpg --batch --quiet --import 2> /dev/null || refuse "The signing subkey cannot be imported."
        imported=$(gpg --batch --with-colons --list-secret-keys | keys)
        [[ "$(grep -c '^sec:' <<< "$imported")" -eq 1 && "$(grep '^sec:' <<< "$imported" | cut -d : -f 5)" == "$fingerprint" ]] \
          || refuse "The signing subkey does not belong to the recorded primary key."
        [[ "$(grep '^sec:' <<< "$imported" | cut -d : -f 4)" == "#" ]] \
          || refuse "The import holds the secret primary key; export only the signing subkey."
        usable=$(grep -E '^ssb:[^erid:]?:[^:]*s[^:]*:\+:' <<< "$imported" | cut -d : -f 5 || true)
        [[ "$(grep -c . <<< "$usable")" -eq 1 ]] || refuse "The import holds no single valid signing subkey."
        grep -Eq "^sub:[^erid:]?:[^:]*s[^:]*:[^:]*:$usable$" <<< "$committed" \
          || refuse "The signing subkey is not a valid signing subkey of the committed public key."
        (umask 077 && printf '%s' "$SIGNING_PASSPHRASE" > "$passphrase")
        for index in "$work"/index/*/; do
          gpg --batch --quiet --pinentry-mode loopback --passphrase-file "$passphrase" --local-user "$usable!" \
            --digest-algo SHA512 --clearsign --output "$index/InRelease" "$index/Release" 2> /dev/null \
            || refuse "gpg could not sign the $(basename "$index") index."
        done

    - name: Verify the index signatures against the committed key
      shell: bash
      run: |
        set -euo pipefail
        refuse() { echo "Signing refused: $1" >&2; exit 1; }
        work="$RUNNER_TEMP/apt-repository"
        # A key ring that holds only the committed public key, as the installed packages register it.
        gpg --batch --dearmor < config/release/signing-key.asc > "$work/keyring.gpg"
        for index in "$work"/index/*/; do
          gpgv --keyring "$work/keyring.gpg" --output "$work/signed-text" "$index/InRelease" 2> /dev/null \
            || refuse "The $(basename "$index") index signature does not verify with the committed key."
          cmp -s "$work/signed-text" "$index/Release" || refuse "The $(basename "$index") InRelease does not sign its Release."
          rm "$work/signed-text"
        done

    - name: Upload the apt repositories
      shell: bash
      env:
        OHTIA_REPOSITORY_ZONE: ${{ inputs.zone }}
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        R2_ACCOUNT_ID: ${{ inputs.r2-account-id }}
        AWS_DEFAULT_REGION: auto
        # R2 accepts the S3 API without the CLI's default request and response checksums.
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        set -Eeuo pipefail
        refuse() { echo "Repository refused: $1" >&2; exit 1; }
        work="$RUNNER_TEMP/apt-repository"
        [[ "$OHTIA_REPOSITORY_ZONE" == stable || "$OHTIA_REPOSITORY_ZONE" == test ]] || refuse "The zone must be stable or test."
        [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || refuse "The R2 account ID is invalid."
        bucket=$(jq -r 'select(.schema_version == 1) | .bucket' config/release/repository.json)
        address=$(jq -r 'select(.schema_version == 1) | .address' config/release/repository.json)
        [[ "$bucket" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ && "$address" =~ ^https://[a-z0-9.-]+$ ]] || refuse "The repository record is invalid."
        endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
        s3() { aws --endpoint-url "$endpoint" --no-cli-pager "$@" < /dev/null; }
        immutable="public, max-age=31536000, immutable"
        phase="" prefix="" served="the previous index is still served"
        # A failed upload names the stopped repository and what clients can still read.
        trap 'echo "::error::The $prefix repository upload is incomplete: it stopped while $phase, and $served. Rerun the job to finish it." >&2' ERR
        for index in "$work"/index/*/; do
          distribution=$(basename "$index")
          prefix="$OHTIA_REPOSITORY_ZONE/$distribution"
          served="the previous index is still served"
          phase="reading the previous index"
          previous="$work/previous/$distribution"
          mkdir -p "$previous"
          s3 s3api list-objects-v2 --bucket "$bucket" --prefix "$prefix/" --output json > "$work/objects-$distribution.json"
          # The previous generation is the one its signed index names: its Packages is read from
          # by-hash, because the plain Packages may already belong to an interrupted upload.
          retained=yes
          if jq -e --arg key "$prefix/InRelease" '[.Contents[]?.Key] | index($key)' "$work/objects-$distribution.json" > /dev/null; then
            s3 s3 cp --only-show-errors "s3://$bucket/$prefix/InRelease" "$previous/InRelease"
            previous_hash=$(awk '/^SHA256:/ { s = 1; next } /^[^ ]/ { s = 0 } s && NF == 3 && $3 == "Packages" { print $1 }' "$previous/InRelease")
            if [[ "$previous_hash" =~ ^[0-9a-f]{64}$ ]] \
              && jq -e --arg key "$prefix/by-hash/SHA256/$previous_hash" '[.Contents[]?.Key] | index($key)' "$work/objects-$distribution.json" > /dev/null; then
              s3 s3 cp --only-show-errors "s3://$bucket/$prefix/by-hash/SHA256/$previous_hash" "$previous/Packages"
              [[ "$(sha256sum "$previous/Packages" | cut -d ' ' -f 1)" == "$previous_hash" ]] || retained=no
            else
              retained=no
            fi
            # A rerun of the same index has the generation before it still on disk: keep it.
            [[ "$previous_hash" != "$(sha256sum "$index/Packages" | cut -d ' ' -f 1)" ]] || retained=same
          fi
          # Packages first, then the indexes by digest, the plain indexes, and the signed index last.
          phase="uploading the packages"
          while IFS=$'\t' read -r _ name _; do
            s3 s3 cp --only-show-errors --cache-control "$immutable" --content-type application/vnd.debian.binary-package \
              "$work/packages/$distribution/$name" "s3://$bucket/$prefix/$name"
          done < <(awk -F '\t' -v d="$distribution" '$1 == d' "$work/packages.tsv")
          phase="uploading the indexes by digest"
          for file in "$index"by-hash/SHA256/*; do
            s3 s3 cp --only-show-errors --cache-control "$immutable" --content-type application/octet-stream \
              "$file" "s3://$bucket/$prefix/by-hash/SHA256/$(basename "$file")"
          done
          phase="uploading the indexes"
          s3 s3 cp --only-show-errors --cache-control no-cache --content-type text/plain "$index/Packages" "s3://$bucket/$prefix/Packages"
          s3 s3 cp --only-show-errors --cache-control no-cache --content-type application/gzip "$index/Packages.gz" "s3://$bucket/$prefix/Packages.gz"
          phase="uploading the signed index"
          s3 s3 cp --only-show-errors --cache-control no-cache --content-type text/plain "$index/InRelease" "s3://$bucket/$prefix/InRelease"
          served="the new signed index is served"
          # Read back through the public address: the bytes clients receive are the release's bytes.
          phase="reading the repository back from $address"
          curl -fsS --retry 3 -H "Cache-Control: no-cache" "$address/$prefix/InRelease?run=$GITHUB_RUN_ID" -o "$work/served-InRelease"
          cmp -s "$work/served-InRelease" "$index/InRelease" || { phase="comparing the served signed index"; false; }
          while IFS=$'\t' read -r _ name sha256; do
            curl -fsS --retry 3 "$address/$prefix/$name" -o "$work/served-package"
            [[ "$(sha256sum "$work/served-package" | cut -d ' ' -f 1)" == "$sha256" ]] || { phase="comparing the served $name"; false; }
            rm "$work/served-package"
          done < <(awk -F '\t' -v d="$distribution" '$1 == d' "$work/packages.tsv")
          # Keep the packages and indexes of the new and the previous index for clients between them.
          phase="removing packages that neither index names"
          if [[ "$retained" == no ]]; then
            echo "::warning::The previous $prefix index names no readable Packages by digest; no file was removed."
          elif [[ "$retained" == same ]]; then
            echo "The previous $prefix index is this index; older files stay until the next version."
          else
            {
              sed -n 's|^Filename: \./||p' "$index/Packages" "$previous/Packages" 2> /dev/null || true
              for release in "$index/InRelease" "$previous/InRelease"; do
                if [[ -f "$release" ]]; then
                  awk '/^SHA256:/ { s = 1; next } /^[^ ]/ { s = 0 } s && NF == 3 { print "by-hash/SHA256/" $1 }' "$release"
                fi
              done
            } | sort -u > "$work/keep-$distribution"
            jq -r --arg prefix "$prefix/" '.Contents[]?.Key | select(startswith($prefix)) | ltrimstr($prefix)' "$work/objects-$distribution.json" \
              | grep -E '^(ohtia-[A-Za-z0-9._~-]+\.deb|by-hash/SHA256/[0-9a-f]{64})$' | sort -u \
              | comm -23 - "$work/keep-$distribution" > "$work/remove-$distribution" || true
            while read -r key; do
              s3 s3 rm --only-show-errors "s3://$bucket/$prefix/$key"
            done < "$work/remove-$distribution"
          fi
          echo "The $prefix repository serves $(grep -c '^Package: ' "$index/Packages") packages at $address/$prefix/."
        done
