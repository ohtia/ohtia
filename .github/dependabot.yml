version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: [dependencies, enhancement, "comp:tooling"]
    groups:
      actions-patches:
        update-types: [patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    labels: [dependencies, enhancement, "comp:tooling"]
